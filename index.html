<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elite 8 Ball Store</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, sans-serif;
}

body{
background:#081424;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.container{
width:90%;
max-width:420px;
background:#0e1c30;
padding:35px;
border-radius:20px;
text-align:center;
box-shadow:0 0 25px rgba(255,215,0,.25);
}

.logo{
width:160px;
border-radius:20px;
margin-bottom:20px;
}

h1{
color:#FFD700;
margin-bottom:10px;
}

p{
color:#bfc8d8;
margin-bottom:35px;
}

button{
width:100%;
padding:18px;
font-size:20px;
background:linear-gradient(90deg,#0066ff,#FFD700);
color:white;
border:none;
border-radius:12px;
cursor:pointer;
font-weight:bold;
}

button:hover{
opacity:.9;
}
</style>

</head>

<body>

<div class="container">

<img src="home-logo.jpg" class="logo">

<h1>Elite 8 Ball Store</h1>

<p>Select the amount you want to pay.</p>

<button onclick="window.location.href='amount.html'">
Go To Price Selection
</button>
  
</div>

</body>
</html>
