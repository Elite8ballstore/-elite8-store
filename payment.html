<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#081424;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.container{
width:90%;
max-width:420px;
background:#0e1c30;
padding:35px;
border-radius:20px;
text-align:center;
box-shadow:0 0 25px rgba(255,215,0,.25);
}

h1{
color:white;
margin-bottom:15px;
}

.amount{
font-size:38px;
font-weight:bold;
color:#FFD700;
margin-bottom:30px;
}

.card{
background:#17365f;
color:white;
padding:18px;
margin:12px 0;
border-radius:12px;
font-size:20px;
cursor:pointer;
transition:.3s;
}

.card:hover{
background:#1f4b85;
}

button{
margin-top:20px;
width:100%;
padding:18px;
font-size:20px;
border:none;
border-radius:12px;
background:linear-gradient(90deg,#0066ff,#FFD700);
color:white;
font-weight:bold;
cursor:pointer;
}
</style>

</head>

<body>

<div class="container">

<h1>Payment</h1>

<div class="amount" id="amount">$0</div>

<div class="card">💳 Visa</div>

<div class="card">💳 MasterCard</div>

<div class="card"> Apple Pay</div>

<div class="card">🤖 Google Pay</div>

<button>Pay Now</button>

</div>

<script>
const params = new URLSearchParams(window.location.search);
const amount = params.get("amount") || "0";
document.getElementById("amount").innerHTML = "$" + amount;
</script>

</body>
</html>
