<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enter Amount</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#081424;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.container{
width:90%;
max-width:420px;
background:#0e1c30;
padding:35px;
border-radius:20px;
text-align:center;
box-shadow:
0 0 30px rgba(0,102,255,.45),
0 0 60px rgba(212,161,0,.45);
}

.logo{
width:160px;
border-radius:20px;
margin-bottom:20px;
}

h1{
color:white;
margin-bottom:10px;
}

p{
color:#cfcfcf;
margin-bottom:20px;
}

input{
width:100%;
padding:18px;
font-size:22px;
border:none;
border-radius:12px;
text-align:center;
margin-bottom:20px;
outline:none;
}

button{
width:100%;
padding:18px;
font-size:20px;
background:linear-gradient(90deg,#0066ff,#FFD700);
color:white;
border:none;
border-radius:12px;
cursor:pointer;
font-weight:bold;
}

button:hover{
opacity:.9;
}
</style>

</head>

<body>

<div class="container">

<img src="payment-logo.jpg.PNG" class="logo">

<h1>Enter Amount</h1>

<p>Enter the amount you want to pay.</p>

<input
type="number"
id="amount"
placeholder="$0.00"

<button onclick="continuePayment()">
Continue
</button>

</div>

<script>
function continuePayment(){

const amount=document.getElementById("amount").value;

if(amount==="" || Number(amount)<=0){
alert("Please enter a valid amount.");
return;
}

window.location.href="payment.html?amount="+encodeURIComponent(amount);

}
</script>

</body>
</html>
